name: deploy platform

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-platform
  cancel-in-progress: false

jobs:
  azure:
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      api_origin: ${{ steps.apps.outputs.api_origin }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate production configuration
        env:
          AZURE_APP_NAME: ${{ vars.AZURE_APP_NAME }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
        run: |
          for name in AZURE_APP_NAME AZURE_LOCATION PUBLIC_WEB_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in the production environment"
              exit 1
            fi
          done
      - uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve Redis scaler connection
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          parsed = urlparse(os.environ["REDIS_URL"])
          if parsed.scheme != "rediss" or not parsed.hostname or not parsed.password:
              raise SystemExit("Production REDIS_URL must be a TLS URL with a password.")
          values = {
              "REDIS_SCALE_ADDRESS": f"{parsed.hostname}:{parsed.port or 6379}",
              "REDIS_SCALE_USERNAME": unquote(parsed.username or "default"),
              "REDIS_SCALE_PASSWORD": unquote(parsed.password),
              "REDIS_SCALE_DATABASE_INDEX": parsed.path.lstrip("/") or "0",
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  if name in {"REDIS_SCALE_USERNAME", "REDIS_SCALE_PASSWORD"}:
                      print(f"::add-mask::{value}")
                  output.write(f"{name}={value}\n")
          PY
      - name: Validate Bicep
        run: az bicep build --file infra/azure/main.bicep
      - name: Provision platform
        id: platform
        env:
          DEPLOYMENT_NAME: stemsplitter-platform-${{ github.run_number }}
        run: |
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --template-file infra/azure/main.bicep \
            --parameters \
              name="${{ vars.AZURE_APP_NAME }}" \
              location="${{ vars.AZURE_LOCATION }}" \
              imageTag="${{ github.sha }}" \
              deploymentVersion="${{ github.run_id }}-${{ github.run_attempt }}" \
              deployApps=false \
              databaseUrl="${{ secrets.DATABASE_URL }}" \
              redisUrl="${{ secrets.REDIS_URL }}" \
              redisScaleAddress="$REDIS_SCALE_ADDRESS" \
              redisScaleUsername="$REDIS_SCALE_USERNAME" \
              redisScalePassword="$REDIS_SCALE_PASSWORD" \
              redisScaleDatabaseIndex="$REDIS_SCALE_DATABASE_INDEX" \
              objectStorageAccessKeyId="${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}" \
              objectStorageSecretAccessKey="${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}" \
              gpuWorkerApiKey="${{ secrets.GPU_WORKER_API_KEY }}" \
              edgeVerifySecret="${{ secrets.EDGE_VERIFY_SECRET }}" \
              metricsBearerToken="${{ secrets.METRICS_BEARER_TOKEN }}" \
              sentryDsn="${{ secrets.SENTRY_DSN }}" \
              authJwksUrl="${{ vars.AUTH_JWKS_URL }}" \
              authIssuer="${{ vars.AUTH_ISSUER }}" \
              authAudience="${{ vars.AUTH_AUDIENCE }}" \
              objectStorageBucket="${{ vars.OBJECT_STORAGE_BUCKET }}" \
              objectStorageEndpointUrl="${{ vars.OBJECT_STORAGE_ENDPOINT_URL }}" \
              objectStorageRegion="${{ vars.OBJECT_STORAGE_REGION }}" \
              gpuWorkerUrl="${{ vars.GPU_WORKER_URL }}" \
              publicWebOrigin="${{ vars.PUBLIC_WEB_ORIGIN }}" \
            --query properties.outputs \
            --output json > deployment-outputs.json
          echo "registry=$(jq -r .containerRegistry.value deployment-outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Authenticate image registry
        id: image
        run: |
          registry_name="${{ steps.platform.outputs.registry }}"
          az acr login --name "${registry_name%%.*}"
          echo "tag=$registry_name/stemsplitter:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy application revisions
        id: apps
        env:
          DEPLOYMENT_NAME: stemsplitter-apps-${{ github.run_number }}
        run: |
          az deployment sub create \
            --name "$DEPLOYMENT_NAME" \
            --location "${{ vars.AZURE_LOCATION }}" \
            --template-file infra/azure/main.bicep \
            --parameters \
              name="${{ vars.AZURE_APP_NAME }}" \
              location="${{ vars.AZURE_LOCATION }}" \
              imageTag="${{ github.sha }}" \
              deploymentVersion="${{ github.run_id }}-${{ github.run_attempt }}" \
              deployApps=true \
              databaseUrl="${{ secrets.DATABASE_URL }}" \
              redisUrl="${{ secrets.REDIS_URL }}" \
              redisScaleAddress="$REDIS_SCALE_ADDRESS" \
              redisScaleUsername="$REDIS_SCALE_USERNAME" \
              redisScalePassword="$REDIS_SCALE_PASSWORD" \
              redisScaleDatabaseIndex="$REDIS_SCALE_DATABASE_INDEX" \
              objectStorageAccessKeyId="${{ secrets.OBJECT_STORAGE_ACCESS_KEY_ID }}" \
              objectStorageSecretAccessKey="${{ secrets.OBJECT_STORAGE_SECRET_ACCESS_KEY }}" \
              gpuWorkerApiKey="${{ secrets.GPU_WORKER_API_KEY }}" \
              edgeVerifySecret="${{ secrets.EDGE_VERIFY_SECRET }}" \
              metricsBearerToken="${{ secrets.METRICS_BEARER_TOKEN }}" \
              sentryDsn="${{ secrets.SENTRY_DSN }}" \
              authJwksUrl="${{ vars.AUTH_JWKS_URL }}" \
              authIssuer="${{ vars.AUTH_ISSUER }}" \
              authAudience="${{ vars.AUTH_AUDIENCE }}" \
              objectStorageBucket="${{ vars.OBJECT_STORAGE_BUCKET }}" \
              objectStorageEndpointUrl="${{ vars.OBJECT_STORAGE_ENDPOINT_URL }}" \
              objectStorageRegion="${{ vars.OBJECT_STORAGE_REGION }}" \
              gpuWorkerUrl="${{ vars.GPU_WORKER_URL }}" \
              publicWebOrigin="${{ vars.PUBLIC_WEB_ORIGIN }}" \
            --query properties.outputs \
            --output json > deployment-outputs.json
          echo "resource_group=$(jq -r .resourceGroupName.value deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "migration_job=$(jq -r .migrationJobName.value deployment-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "api_origin=$(jq -r .apiOrigin.value deployment-outputs.json)" >> "$GITHUB_OUTPUT"
      - name: Apply database migrations
        run: |
          execution_name="$(
            az containerapp job start \
              --resource-group "${{ steps.apps.outputs.resource_group }}" \
              --name "${{ steps.apps.outputs.migration_job }}" \
              --query name \
              --output tsv
          )"
          if [ -z "$execution_name" ]; then
            echo "::error::Azure did not return a migration execution name"
            exit 1
          fi

          status=""
          for attempt in $(seq 1 60); do
            status="$(
              az containerapp job execution show \
                --resource-group "${{ steps.apps.outputs.resource_group }}" \
                --name "${{ steps.apps.outputs.migration_job }}" \
                --job-execution-name "$execution_name" \
                --query properties.status \
                --output tsv
            )"
            case "$status" in
              Succeeded)
                break
                ;;
              Failed|Stopped|Degraded)
                echo "::error::Migration execution $execution_name finished with status $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          if [ "$status" != "Succeeded" ]; then
            echo "::error::Migration execution $execution_name timed out with status ${status:-unknown}"
            exit 1
          fi
      - name: Production preflight
        env:
          API_ORIGIN: ${{ steps.apps.outputs.api_origin }}
          EDGE_VERIFY_SECRET: ${{ secrets.EDGE_VERIFY_SECRET }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          url = os.environ["API_ORIGIN"] + "/health/dependencies"
          headers = {
              "X-StemSplitter-Origin-Verify": os.environ["EDGE_VERIFY_SECRET"],
          }
          last_error = "not_attempted"
          for attempt in range(1, 13):
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.load(response)
                  if payload.get("status") == "ready":
                      print(json.dumps(payload, sort_keys=True))
                      break
                  last_error = json.dumps(payload, sort_keys=True)
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  last_error = f"HTTP {exc.code}: {body[:500]}"
              except Exception as exc:
                  last_error = f"{type(exc).__name__}: {exc}"

              if attempt < 12:
                  print(
                      f"Preflight attempt {attempt}/12 not ready: {last_error}",
                      flush=True,
                  )
                  time.sleep(10)
          else:
              raise SystemExit(f"Production preflight failed: {last_error}")
          PY

  cloudflare:
    needs: azure
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: /api
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy --var API_ORIGIN:${{ needs.azure.outputs.api_origin }}
          secrets: |
            ORIGIN_VERIFY_SECRET
        env:
          ORIGIN_VERIFY_SECRET: ${{ secrets.EDGE_VERIFY_SECRET }}
      - name: Verify public web and API routes
        env:
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          origin = os.environ["PUBLIC_WEB_ORIGIN"].rstrip("/")
          checks = {
              "/api/health/live": "ok",
              "/api/health/ready": "ready",
          }
          for path, expected_status in checks.items():
              last_error = "not_attempted"
              for attempt in range(1, 7):
                  try:
                      request = urllib.request.Request(
                          origin + path,
                          headers={"Accept": "application/json"},
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          content_type = response.headers.get_content_type()
                          payload = json.load(response)
                      if content_type != "application/json":
                          raise RuntimeError(
                              f"expected application/json, got {content_type}"
                          )
                      if payload.get("status") != expected_status:
                          raise RuntimeError(f"unexpected payload: {payload}")
                      print(f"{path}: {payload}")
                      break
                  except Exception as exc:
                      last_error = f"{type(exc).__name__}: {exc}"
                      if attempt < 6:
                          time.sleep(5)
              else:
                  raise SystemExit(f"Public edge check failed for {path}: {last_error}")
          PY
