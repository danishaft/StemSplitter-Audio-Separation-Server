schema_version: "1.0"
trainer:
  repository: https://github.com/ZFTurbo/Music-Source-Separation-Training
  revision: 83d495dfc81b2ede9bc62f4209619f8bdfd14995

recipe_budget:
  train_cumulative:
    25: 2000
    50: 4000
    100: 8000
  validation: 1024
  test: 1024

training_schedule:
  num_steps_per_epoch: 1000
  stages:
    25:
      cumulative_epochs: 4
    50:
      cumulative_epochs: 8
    100:
      cumulative_epochs: 12

trainer_defaults:
  batch_size: 2
  gradient_accumulation_steps: 4
  grad_clip: 1
  lr: 0.000005
  patience: 2
  reduce_factor: 0.9
  q: 0.95
  coarse_loss_clip: true
  ema_momentum: 0.999
  other_fix: false

