[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stemsplitter"
version = "0.1.0"
description = "Asynchronous music source-separation control plane and GPU worker platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PyJWT[crypto]>=2.10.0",
  "PyYAML>=6.0.0",
  "audio2midi[librosa_pitch_detector]==0.3.0",
  "azure-monitor-opentelemetry>=1.6.0",
  "boto3>=1.35.0",
  "fastapi>=0.140.0,<1.0",
  "librosa==0.11.0",
  "numpy>=1.26.0",
  "opentelemetry-exporter-otlp-proto-http>=1.35.0",
  "opentelemetry-instrumentation-fastapi>=0.56b0",
  "opentelemetry-sdk>=1.35.0",
  "prometheus-client>=0.21.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "python-multipart>=0.0.20",
  "redis>=5.2.0",
  "requests>=2.31.0",
  "rq>=2.1.0",
  "sentry-sdk[fastapi]>=2.35.0",
  "scipy>=1.12.0",
  "soundfile>=0.12.0",
  "uvicorn[standard]>=0.51.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17.0",
  "pytest>=8.4.0",
  "pytest-cov>=6.2.0",
  "ruff>=0.12.0",
]

[project.scripts]
stemsplitter-api = "scripts.run_api:main"
stemsplitter-worker = "scripts.run_rq_worker:main"
stemsplitter-maintenance = "scripts.run_maintenance_worker:main"

[tool.setuptools.packages.find]
include = ["splitter*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: tests that cross process or storage boundaries",
  "slow: long-running model or network tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "datasets",
  "external_repos",
  "frontend",
  "research/runs",
  "tmp",
  "training",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(datasets|external_repos|research/runs|tmp|training)/"
